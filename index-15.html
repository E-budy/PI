<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CampusHub — Your campus. Your ideas.</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* CampusHub — Spider-Verse UI Theme: Deep Blue + Spidey Red, web accents, comic feel. */
:root{
  --red:#D7212B;--red-2:#F23A47;--red-ink:#8C0E17;--blue:#0C1C6A;--blue-2:#1E33A8;
  --ink:#0A1030;--mut:#5B6484;--bg:#F6F1E7;--bg-2:#EDE4D1;--card:#FFFFFF;--line:#E6DBC6;--line-2:#D7CBB2;--bad:#B91525;--ok:#0F7A47;
  --shadow:0 1px 0 rgba(10,16,48,.04),0 10px 28px rgba(10,16,48,.08);
  --shadow-lg:0 2px 0 rgba(10,16,48,.06),0 24px 60px rgba(10,16,48,.14);
  --ring:0 0 0 3px rgba(215,33,43,.25);--radius:14px;--radius-lg:18px;
  --web-dot:radial-gradient(circle at 1px 1px,rgba(10,16,48,.08) 1px,transparent 1.4px);
  --web-bg:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520' viewBox='0 0 520 520'><g fill='none' stroke='%230A1030' stroke-opacity='.07' stroke-width='.9'><circle cx='260' cy='260' r='60'/><circle cx='260' cy='260' r='120'/><circle cx='260' cy='260' r='180'/><circle cx='260' cy='260' r='240'/><path d='M260 20 L260 500 M20 260 L500 260 M80 80 L440 440 M80 440 L440 80 M160 40 L360 480 M40 160 L480 360 M40 360 L480 160 M160 480 L360 40'/></g></svg>");
  --web-corner:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><g fill='none' stroke='%23D7212B' stroke-opacity='.55' stroke-width='1.3' stroke-linecap='round'><path d='M0 0 L180 0 L180 180'/><path d='M0 0 L160 20 L170 160'/><path d='M0 0 L130 40 L150 140'/><path d='M0 0 L100 55 L130 120'/><path d='M0 0 L70 65 L105 100'/><path d='M0 0 L40 70 L75 80'/><path d='M30 0 L160 20 M60 0 L130 40 M90 0 L100 55 M120 0 L70 65 M150 0 L40 70'/><path d='M180 30 L170 160 M180 60 L150 140 M180 90 L130 120 M180 120 L105 100 M180 150 L75 80'/></g></svg>");
}
@media (prefers-color-scheme:dark){
  :root{
    --red:#FF2E3F;--red-2:#FF5968;--red-ink:#FF8691;--blue:#5B82FF;--blue-2:#8AA6FF;
    --ink:#EEF1FF;--mut:#8B93B5;--bg:#060A1F;--bg-2:#0A1030;--card:#0E1540;--line:#1C2560;--line-2:#283074;--bad:#FF4A5A;--ok:#2BD187;
    --shadow:0 0 0 1px rgba(255,46,63,.08),0 10px 32px rgba(0,0,0,.55);
    --shadow-lg:0 0 0 1px rgba(255,46,63,.12),0 30px 80px rgba(0,0,0,.7);
    --ring:0 0 0 3px rgba(255,46,63,.35),0 0 24px rgba(255,46,63,.35);
    --web-dot:radial-gradient(circle at 1px 1px,rgba(255,46,63,.14) 1px,transparent 1.4px);
    --web-bg:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='520' height='520' viewBox='0 0 520 520'><g fill='none' stroke='%23FF2E3F' stroke-opacity='.09' stroke-width='.9'><circle cx='260' cy='260' r='60'/><circle cx='260' cy='260' r='120'/><circle cx='260' cy='260' r='180'/><circle cx='260' cy='260' r='240'/><path d='M260 20 L260 500 M20 260 L500 260 M80 80 L440 440 M80 440 L440 80 M160 40 L360 480 M40 160 L480 360 M40 360 L480 160 M160 480 L360 40'/></g></svg>");
    --web-corner:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180' viewBox='0 0 180 180'><g fill='none' stroke='%23FF2E3F' stroke-opacity='.75' stroke-width='1.3' stroke-linecap='round'><path d='M0 0 L180 0 L180 180'/><path d='M0 0 L160 20 L170 160'/><path d='M0 0 L130 40 L150 140'/><path d='M0 0 L100 55 L130 120'/><path d='M0 0 L70 65 L105 100'/><path d='M0 0 L40 70 L75 80'/><path d='M30 0 L160 20 M60 0 L130 40 M90 0 L100 55 M120 0 L70 65 M150 0 L40 70'/><path d='M180 30 L170 160 M180 60 L150 140 M180 90 L130 120 M180 120 L105 100 M180 150 L75 80'/></g></svg>");
  }
}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:Manrope,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;background-image:var(--web-dot),var(--web-bg);background-size:22px 22px,520px 520px;background-position:0 0,right -140px top -160px;background-repeat:repeat,no-repeat;background-attachment:fixed,fixed}
body::before{content:"";position:fixed;top:-10px;left:-10px;width:220px;height:220px;background:var(--web-corner) center/contain no-repeat;transform:scaleX(-1);opacity:.9;pointer-events:none;z-index:1}
body::after{content:"";position:fixed;right:-18px;bottom:-18px;width:200px;height:200px;background:var(--web-corner) center/contain no-repeat;transform:scaleY(-1) rotate(180deg);opacity:.75;pointer-events:none;z-index:1}
h1,h2,h3,p{margin:0}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--ring);border-radius:10px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px;position:relative;z-index:2}

/* TOP BAR */
.top{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border-bottom:1px solid var(--line)}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--red) 0%,var(--red) 50%,var(--blue) 50%,var(--blue) 100%);opacity:.9}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}

/* LOGO + SWINGING SPIDEY (1cm x 1cm, centered under CampusHub) */
.logo-stack{display:flex;flex-direction:column;align-items:center;margin:0 auto;line-height:1}
.swing{position:absolute;left:50%;top:100%;width:2.2cm;height:auto;margin-left:-1.1cm;transform-origin:50% 0;pointer-events:none;z-index:25;animation:swing 2.2s ease-in-out infinite alternate;transition:opacity .2s ease}body.scrolled .swing{opacity:0;visibility:hidden}@keyframes swing{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.logo{display:flex;align-items:center;gap:10px;font-family:"Bungee",Manrope,sans-serif;font-weight:400;letter-spacing:.02em;color:var(--blue);font-size:17px;text-transform:uppercase}
@media (prefers-color-scheme:dark){.logo{color:var(--red);text-shadow:0 0 18px rgba(255,46,63,.45)}}
.logo svg rect:nth-of-type(1){fill:var(--red)}.logo svg rect:nth-of-type(2){fill:var(--blue)}.logo svg rect:nth-of-type(3){fill:var(--blue)}.logo svg rect:nth-of-type(4){fill:var(--red)}
.logo svg{filter:drop-shadow(0 2px 0 rgba(10,16,48,.15))}
@media (prefers-color-scheme:dark){.logo svg{filter:drop-shadow(0 0 10px rgba(255,46,63,.55))}}
.ib{width:44px;height:44px;border:1px solid transparent;background:transparent;border-radius:12px;cursor:pointer;font-size:22px;display:grid;place-items:center;color:var(--ink);transition:background .15s ease,border-color .15s ease,transform .1s ease}
.ib:hover{background:color-mix(in oklab,var(--red) 10%,transparent);border-color:color-mix(in oklab,var(--red) 25%,transparent)}.ib:active{transform:scale(.96)}
.chip{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;color:var(--ink)}
.chip>span:first-child{padding:6px 10px;border-radius:999px;background:color-mix(in oklab,var(--blue) 10%,transparent);color:var(--blue);border:1px solid color-mix(in oklab,var(--blue) 25%,transparent);letter-spacing:.02em;text-transform:uppercase;font-size:11px}
@media (prefers-color-scheme:dark){.chip>span:first-child{background:rgba(91,130,255,.12);color:var(--blue);border-color:rgba(91,130,255,.35)}}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--red) 0%,var(--red-2) 55%,var(--blue) 100%);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;box-shadow:0 0 0 2px var(--bg),0 6px 14px rgba(215,33,43,.4);font-family:"Bungee",Manrope,sans-serif;letter-spacing:.02em}

/* HERO */
.hero{text-align:center;padding:84px 0 36px;position:relative}
.hero::before{display:none}
.top+main{padding-top:165px}.top+main .head{padding-top:10px}
h1{font-family:"Bungee",Manrope,sans-serif;font-weight:400;font-size:clamp(36px,7vw,64px);letter-spacing:.005em;line-height:1.02;color:var(--blue);text-transform:uppercase;text-shadow:2px 2px 0 var(--red),4px 4px 0 rgba(10,16,48,.12)}
@media (prefers-color-scheme:dark){h1{color:#fff;text-shadow:2px 2px 0 var(--red),0 0 36px rgba(255,46,63,.35)}}
.sub{color:var(--mut);max-width:600px;margin:20px auto 0;font-size:17px;font-weight:500}.mut{color:var(--mut);font-size:14px}
.two{display:grid;gap:18px;grid-template-columns:1fr 1fr;margin:40px 0 26px;text-align:left}
@media(max-width:720px){.two{grid-template-columns:1fr}.hero{padding-top:52px}}

/* CARD */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,color-mix(in oklab,var(--red) 6%,transparent) 0,transparent 60px);opacity:.6}
@media (prefers-color-scheme:dark){.card::before{background:linear-gradient(180deg,rgba(255,46,63,.08) 0,transparent 70px)}}
.card h2{font-family:"Bungee",Manrope,sans-serif;font-weight:400;font-size:19px;margin-bottom:14px;color:var(--blue);text-transform:uppercase;letter-spacing:.02em}
@media (prefers-color-scheme:dark){.card h2{color:#fff}}
.row{display:flex;gap:10px}

/* INPUTS */
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line-2);border-radius:11px;background:var(--card);min-height:46px;color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
input::placeholder,textarea::placeholder{color:color-mix(in oklab,var(--mut) 85%,transparent)}
input:hover,select:hover,textarea:hover{border-color:color-mix(in oklab,var(--red) 35%,var(--line-2))}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:var(--ring);outline:none}
textarea{min-height:104px;resize:vertical}

/* BUTTONS */
.btn{position:relative;border:1.5px solid var(--line-2);background:var(--card);border-radius:11px;padding:0 18px;min-height:46px;font-weight:800;letter-spacing:.01em;cursor:pointer;white-space:nowrap;color:var(--ink);transition:transform .08s ease,box-shadow .15s ease,background .15s ease,border-color .15s ease,color .15s ease}
.btn:hover{border-color:var(--red);color:var(--red-ink);background:color-mix(in oklab,var(--red) 7%,var(--card));box-shadow:0 6px 18px rgba(215,33,43,.15)}.btn:active{transform:translateY(1px)}
@media (prefers-color-scheme:dark){.btn:hover{color:#fff;background:rgba(255,46,63,.14);border-color:var(--red);box-shadow:0 0 24px rgba(255,46,63,.3)}}
.btn.pri{background:linear-gradient(180deg,var(--red) 0%,var(--red-2) 100%);border-color:var(--red-ink);color:#fff;box-shadow:0 2px 0 var(--red-ink),0 10px 24px rgba(215,33,43,.35);text-transform:uppercase;font-family:"Bungee",Manrope,sans-serif;font-weight:400;letter-spacing:.04em}
.btn.pri:hover{filter:brightness(1.05);box-shadow:0 2px 0 var(--red-ink),0 14px 32px rgba(215,33,43,.55);color:#fff}
.btn.pri:active{box-shadow:0 1px 0 var(--red-ink),0 6px 18px rgba(215,33,43,.4)}
@media (prefers-color-scheme:dark){.btn.pri{box-shadow:0 0 0 1px rgba(255,46,63,.6),0 0 32px rgba(255,46,63,.5)}.btn.pri:hover{box-shadow:0 0 0 1px rgba(255,46,63,.9),0 0 48px rgba(255,46,63,.7)}}
.btn.bad{background:linear-gradient(180deg,#CF1A28,#8E0E17);border-color:#6E0A11;color:#fff;text-transform:uppercase;font-family:"Bungee",Manrope,sans-serif;font-weight:400}
.btn.sm{min-height:38px;padding:0 14px;font-size:12px;border-radius:9px}.btn:disabled{opacity:.6;cursor:wait}
.res{margin-top:14px;display:grid;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;background:color-mix(in oklab,var(--card) 94%,transparent);transition:border-color .15s ease,transform .1s ease,background .15s ease}
.item:hover{border-color:var(--red);background:color-mix(in oklab,var(--red) 4%,var(--card))}.item b{display:block;font-size:15px;font-weight:800;color:var(--ink)}

/* AUTH */
.auth{max-width:440px;margin:46px auto;padding:0 16px}.auth .card{padding:30px;border-radius:20px}
.auth h2{text-align:center;font-size:28px;color:var(--blue);margin:14px 0 6px;font-family:"Bungee",Manrope,sans-serif;font-weight:400;letter-spacing:.02em;text-transform:uppercase}
@media (prefers-color-scheme:dark){.auth h2{color:#fff;text-shadow:0 0 18px rgba(255,46,63,.35)}}
.g{width:100%;display:flex;gap:10px;justify-content:center;align-items:center}
.or{display:flex;align-items:center;gap:12px;color:var(--mut);font-size:11px;font-weight:800;margin:18px 0;text-transform:uppercase;letter-spacing:.14em}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--line-2)}
form{display:grid;gap:14px}
label{font-size:12px;font-weight:800;display:grid;gap:6px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.lnk{background:none;border:0;color:var(--red);font-weight:800;cursor:pointer;padding:6px 0;text-align:left;font-size:14px}.lnk:hover{color:var(--red-2);text-decoration:underline}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.g2{grid-template-columns:1fr}}

/* HEADER / STATS */
.head{padding:42px 0 10px;position:relative}.head h1{font-size:clamp(32px,6vw,52px);text-shadow:2px 2px 0 var(--red),4px 4px 0 rgba(10,16,48,.1)}
.stats{display:flex;gap:26px;margin-top:14px;color:var(--mut);font-size:14px;flex-wrap:wrap}.stats b{color:var(--ink);font-weight:800;font-size:16px;margin-right:2px}
.bar{margin:22px 0 14px;display:grid;gap:14px}
.pills{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.pills::-webkit-scrollbar{display:none}
.pill{border:1.5px solid var(--line-2);background:var(--card);border-radius:999px;padding:9px 17px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;min-height:40px;color:var(--ink);letter-spacing:.01em;transition:all .15s ease}
.pill:hover{border-color:var(--red);color:var(--red-ink);background:color-mix(in oklab,var(--red) 6%,var(--card))}
@media (prefers-color-scheme:dark){.pill:hover{color:#fff;background:rgba(255,46,63,.1)}}
.pill[aria-pressed=true]{background:linear-gradient(180deg,var(--red),var(--red-2));border-color:var(--red-ink);color:#fff;box-shadow:0 2px 0 var(--red-ink),0 10px 20px rgba(215,33,43,.3)}
@media (prefers-color-scheme:dark){.pill[aria-pressed=true]{box-shadow:0 0 0 1px rgba(255,46,63,.6),0 0 24px rgba(255,46,63,.5)}}
.srt{display:flex;justify-content:space-between;align-items:center;gap:10px}.srt select{width:auto;min-height:40px;padding:6px 12px;font-weight:700;font-size:13px}
.feed{display:grid;gap:16px;padding-bottom:80px}

/* POST CARD */
.post{position:relative}
.post::after{content:"";position:absolute;top:0;right:0;width:84px;height:84px;background:var(--web-corner) top right/contain no-repeat;transform:scaleX(-1);opacity:.35;pointer-events:none}
.post h3{font-family:"Bungee",Manrope,sans-serif;font-weight:400;font-size:22px;letter-spacing:.005em;margin:8px 0;color:var(--ink);text-transform:uppercase;line-height:1.1}
@media (prefers-color-scheme:dark){.post h3{color:#fff}}
.by{font-size:12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.post p{color:color-mix(in oklab,var(--ink) 82%,var(--mut));overflow-wrap:anywhere;line-height:1.6}
.badge{display:inline-block;background:linear-gradient(180deg,var(--red),var(--red-2));color:#fff;font-size:11px;padding:4px 12px;border-radius:4px;text-transform:uppercase;letter-spacing:.1em;box-shadow:0 2px 0 var(--red-ink);transform:rotate(-2deg);font-family:"Bungee",Manrope,sans-serif;font-weight:400}
@media (prefers-color-scheme:dark){.badge{box-shadow:0 0 0 1px rgba(255,46,63,.6),0 0 20px rgba(255,46,63,.5)}}
.pf{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin-top:16px}.pf .d{margin-left:auto;font-size:12px;color:var(--mut);font-weight:700}
.pf a{color:var(--red);font-weight:800;text-decoration:none;font-size:14px;display:inline-flex;align-items:center;gap:4px;padding:4px 0;border-bottom:2px solid transparent;transition:border-color .15s ease,color .15s ease}
.pf a:hover{color:var(--red-2);border-bottom-color:var(--red-2)}
.sk{height:140px;border-radius:var(--radius-lg);background:linear-gradient(90deg,var(--bg-2) 25%,var(--card) 50%,var(--bg-2) 75%);background-size:200% 100%;animation:sh 1.3s infinite}@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:50px 20px}.empty h2{color:var(--blue);margin-bottom:10px;font-family:"Bungee",Manrope,sans-serif;font-weight:400;text-transform:uppercase}
@media (prefers-color-scheme:dark){.empty h2{color:#fff}}.empty .btn{margin-top:18px}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(6,10,31,.68);z-index:40;display:grid;place-items:center;padding:16px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:ovIn .18s ease-out}@keyframes ovIn{from{opacity:0}to{opacity:1}}
.md{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:var(--shadow-lg);position:relative;animation:mdIn .22s cubic-bezier(.2,.9,.3,1.2)}
@keyframes mdIn{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.md::before{content:"";position:absolute;top:0;right:0;width:120px;height:120px;background:var(--web-corner) top right/contain no-repeat;transform:scaleX(-1);opacity:.45;pointer-events:none;border-top-right-radius:20px;overflow:hidden}
.md h2{margin-bottom:18px;color:var(--blue);font-family:"Bungee",Manrope,sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:.02em;font-size:22px}
@media (prefers-color-scheme:dark){.md h2{color:#fff;text-shadow:0 0 18px rgba(255,46,63,.3)}}
.md .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}

/* DRAWER */
#dr{position:fixed;inset:0;z-index:30;pointer-events:none}
#dr .sh{position:absolute;inset:0;background:rgba(6,10,31,.55);opacity:0;transition:opacity .22s;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#dr nav{position:absolute;left:0;top:0;bottom:0;width:min(340px,88vw);background:var(--card);transform:translateX(-100%);transition:transform .25s cubic-bezier(.2,.9,.3,1);padding:22px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);box-shadow:30px 0 60px rgba(6,10,31,.3)}
#dr nav::before{content:"";position:absolute;top:0;right:0;width:160px;height:160px;background:var(--web-corner) top right/contain no-repeat;transform:scaleX(-1);opacity:.5;pointer-events:none}
#dr nav::after{content:"";position:absolute;top:0;bottom:0;right:0;width:4px;background:linear-gradient(180deg,var(--red),var(--blue))}
#dr.o{pointer-events:auto}#dr.o .sh{opacity:1}#dr.o nav{transform:none}
#dr nav .me{padding:8px 0 18px;border-bottom:1px solid var(--line);margin-bottom:10px}
#dr nav .me b{font-size:19px;display:block;font-family:"Bungee",Manrope,sans-serif;font-weight:400;color:var(--blue);letter-spacing:.02em;text-transform:uppercase;line-height:1.15;margin-bottom:4px}
@media (prefers-color-scheme:dark){#dr nav .me b{color:#fff}}
.mi{text-align:left;background:transparent;border:0;padding:14px 12px;border-radius:11px;font-weight:700;cursor:pointer;min-height:48px;color:var(--ink);font-size:15px;transition:background .15s ease,color .15s ease,padding-left .15s ease;display:flex;align-items:center;gap:10px}
.mi:hover{background:color-mix(in oklab,var(--red) 10%,transparent);color:var(--red-ink);padding-left:16px}
@media (prefers-color-scheme:dark){.mi:hover{color:#fff;background:rgba(255,46,63,.12)}}

/* TOASTS */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:grid;gap:10px;width:min(92vw,400px)}
.t{background:var(--blue);color:#fff;padding:14px 18px;border-radius:12px;font-size:14px;font-weight:700;box-shadow:0 12px 30px rgba(10,16,48,.35),0 0 0 1px rgba(255,255,255,.08);animation:tIn .25s cubic-bezier(.2,.9,.3,1.2);border-left:4px solid var(--red)}
.t.e{background:linear-gradient(180deg,var(--bad),#8E0E17);border-left-color:#fff}
@media (prefers-color-scheme:dark){.t{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);box-shadow:0 0 0 1px rgba(255,46,63,.3),0 0 32px rgba(255,46,63,.25),0 20px 40px rgba(0,0,0,.6)}}
@keyframes tIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.demo{background:linear-gradient(90deg,var(--red) 0%,var(--red-2) 50%,var(--red) 100%);color:#fff;text-align:center;font-size:12px;padding:7px;text-transform:uppercase;letter-spacing:.14em;font-family:"Bungee",Manrope,sans-serif;font-weight:400;position:relative;z-index:2}
.spin{height:100vh;display:grid;place-items:center;color:var(--blue);font-family:"Bungee",Manrope,sans-serif;font-weight:400;font-size:22px;letter-spacing:.08em;text-transform:uppercase;position:relative;z-index:2}
.spin::before{content:"";position:absolute;top:50%;left:50%;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;border:3px solid var(--red);border-top-color:transparent;animation:sp 1s linear infinite;opacity:.5}
@media (prefers-color-scheme:dark){.spin{color:#fff}.spin::before{box-shadow:0 0 32px rgba(255,46,63,.5)}}
@keyframes sp{to{transform:rotate(360deg)}}
.about p{margin:12px 0;color:color-mix(in oklab,var(--ink) 80%,var(--mut));font-size:16px;line-height:1.7}.about p:first-of-type{font-size:18px}
@media(max-width:520px){.wrap{padding:0 16px}.hero{padding:60px 0 24px}body::before,body::after{width:140px;height:140px;opacity:.6}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function toast(m,e){const t=document.createElement("div");t.className="t"+(e?" e":"");t.textContent=m;$("#toasts").append(t);setTimeout(()=>t.remove(),3800)}
function fe(e){const c=e?.code||"";return({"auth/invalid-email":"Enter a valid email address.","auth/weak-password":"Password should be at least 6 characters.","auth/email-already-in-use":"An account with this email already exists. Try signing in.","auth/wrong-password":"Incorrect email or password.","auth/invalid-credential":"Incorrect email or password.","auth/user-not-found":"Incorrect email or password.","auth/popup-closed-by-user":"Sign-in was cancelled.","auth/cancelled-popup-request":"Sign-in was cancelled.","auth/network-request-failed":"Network error. Check your connection.","auth/unauthorized-domain":"This domain isn't authorized in Firebase Authentication settings.","permission-denied":"You don't have permission to do that.","auth/too-many-requests":"Too many attempts. Try again later."})[c]||(e?.msg||"Something went wrong. Please try again.")}
async function run(b,label,fn){const o=b?.textContent;if(b){b.disabled=true;b.textContent=label}try{await fn()}catch(e){console.error(e);toast(fe(e),1)}finally{if(b&&b.isConnected){b.disabled=false;b.textContent=o}}}
function normUrl(u,req){u=(u||"").trim();if(!u){if(req)throw{msg:"Enter a website URL."};return""}if(/^(javascript|data|vbscript):/i.test(u))throw{msg:"That link type isn't allowed."};if(!/^https?:\/\//i.test(u))u="https://"+u;let x;try{x=new URL(u)}catch{throw{msg:"Enter a valid URL like https://example.com."}}if(!/^https?:$/.test(x.protocol)||!x.hostname.includes("."))throw{msg:"Enter a valid URL like https://example.com."};return x.href}
const ini=n=>(n||"?").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);

function collegeRes(){const q=($("#cq")?.value||"").trim().toLowerCase(),el=$("#cres");if(!el)return;if(!q){el.innerHTML="";return}

 <div class="bar"><input id="sq" type="search" placeholder="Search your campus..." aria-label="Search your campus" value="${esc(S.q)}"><div class="pills" role="group" aria-label="Filter by category">${FILT.map(f=>`<button class="pill" data-a="flt" data-id="${f[1]}" aria-pressed="${S.f===f[1]}">${f[0]}</button>`).join("")}</div>
 <div class="srt"><span class="mut" id="cnt"></span><select id="so" aria-label="Sort"><option value="latest">Latest</option><option value="oldest">Oldest</option><option value="updated">Recently updated</option></select></div></div><div class="feed" id="feed"></div></main>`;
 $("#so").value=S.sort;$("#sq").addEventListener("input",e=>{S.q=e.target.value;feed();if(S.q.length>2)track("search_performed")});$("#so").addEventListener("change",e=>{S.sort=e.target.value;feed()});feed();stats()}
async function stats(){if(demo)return;try{const r=await F.getCountFromServer(F.query(F.collection(db,"users"),F.where("collegeId","==",S.profile.collegeId)));const el=$("#st b");if(el)el.textContent=r.data().count}catch{}}
const ts=x=>x?.createdAt?.toDate?.().getTime?.()||0,tu=x=>x?.updatedAt?.toDate?.().getTime?.()||ts(x);
function card(x,own){const d=x.createdAt?.toDate?.().toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})||"Just now";
 return `<article class="card post"><span class="badge">${esc(x.category)}</span><h3>${esc(x.title)}</h3><div class="by">${esc(x.authorName)}${x.authorUsername?" (@"+esc(x.authorUsername)+")":""} · ${esc(x.authorBranch)} · ${esc(x.authorYear)}</div><p style="margin-top:8px">${esc(x.description)}</p>
 <div class="pf"><a href="${esc(x.websiteUrl)}" target="_blank" rel="noopener noreferrer" data-a="visit">Visit Website →</a>${x.githubUrl?`<a href="${esc(x.githubUrl)}" target="_blank" rel="noopener noreferrer">GitHub</a>`:""}${x.demoUrl?`<a href="${esc(x.demoUrl)}" target="_blank" rel="noopener noreferrer">Demo</a>`:""}<span class="d">${d}</span></div>
 ${own?`<div class="pf" style="margin-top:10px"><button class="btn sm" data-a="edit" data-id="${x.id}">Edit</button><button class="btn sm" data-a="del" data-id="${x.id}">Delete</button></div>`:""}</article>`}
function feed(mine){const el=$("#feed");if(!el)return;const uid=auth?.currentUser?.uid,q=S.q.trim().toLowerCase();
 let l=[...S.posts];if(mine)l=l.filter(x=>x.userId===uid);else{if(S.f)l=l.filter(x=>x.category===S.f);if(q)l=l.filter(x=>[x.title,x.description,x.authorName,x.authorUsername,x.category].some(v=>(v||"").toLowerCase().includes(q)))}
 l.sort((a,b)=>S.sort==="oldest"?ts(a)-ts(b):S.sort==="updated"?tu(b)-tu(a):ts(b)-ts(a));
 const c=$("#cnt");if(c)c.textContent=l.length+(l.length===1?" result":" results");
 if(!l.length){el.innerHTML=mine?`<div class="card empty"><h2>You haven't shared anything yet.</h2><p class="mut">Show your campus what you're building.</p><button class="btn pri" data-a="new">Share Your Website</button></div>`:S.posts.length?`<div class="card empty"><h2>Nothing found.</h2><p class="mut">Try another search.</p><button class="btn" data-a="clr">Clear filters</button></div>`:`<div class="card empty"><h2>Your campus is just getting started.</h2><p class="mut">Be the first student to share something you're building.</p><button class="btn pri" data-a="new">Share Your Website</button></div>`;return}
 el.innerHTML=l.map(x=>card(x,mine||x.userId===uid)).join("")}
function mine(){S.view="mine";app.innerHTML=`${shell()}<main class="wrap"><div class="head"><h1 style="font-size:32px">My Posts</h1><p class="mut">${esc(S.profile.name)} · ${esc(S.profile.branch)} · ${esc(S.profile.year)}</p></div><div class="feed" id="feed" style="margin-top:16px"></div></main>`;feed(true)}
function about(){S.view="about";app.innerHTML=`${shell()}<main class="wrap"><div class="card about" style="margin:30px 0"><h1 style="font-size:32px">About CampusHub</h1><p><b>CampusHub helps students discover what their own classmates are building.</b></p><p>Websites. Projects. Startups. Products. Ideas.</p><p>One college at a time.</p></div></main>`}
function skeleton(){app.innerHTML=`${shell()}<main class="wrap" style="padding-top:34px;display:grid;gap:14px">${'<div class="sk"></div>'.repeat(4)}</main>`}

/* ---------- Drawer & modals ---------- */
function drawer(open){const d=$("#dr"),p=S.profile;if(open){d.innerHTML=`<div class="sh" data-a="menu0"></div><nav aria-label="Menu"><div style="display:flex;justify-content:space-between"><div class="me"><b>${esc(p.name)}</b><span class="mut">${esc(p.branch)} · ${esc(p.year)}</span><br><span class="mut">${esc(p.collegeShortName)}</span></div><button class="ib" data-a="menu0" aria-label="Close menu">✕</button></div>
 <button class="mi" data-a="new">Show Your Website</button><button class="mi" data-a="mine">My Posts</button><button class="mi" data-a="prof">Edit Profile</button><button class="mi" data-a="about">About CampusHub</button><button class="mi" data-a="logout">Logout</button></nav>`;d.classList.add("o");d.setAttribute("aria-hidden","false");d.querySelector("nav button.mi").focus()}else{d.classList.remove("o");d.setAttribute("aria-hidden","true")}}
function modal(h){$("#modal").innerHTML=`<div class="ov" data-a="mclose" role="dialog" aria-modal="true"><div class="md">${h}</div></div>`;$("#modal input,#modal select,#modal textarea")?.focus()}
const mclose=()=>$("#modal").innerHTML="";
const postForm=x=>modal(`<h2>${x?"Edit your post":"What are you building?"}</h2><form data-f="post" data-id="${x?.id||""}"><label>Name<input name="title" required maxlength="100" value="${esc(x?.title)}" placeholder="Smart Irrigation System"></label><label>Description<textarea name="description" required maxlength="600" placeholder="An IoT-based irrigation system that controls water flow.">${esc(x?.description)}</textarea></label><label>Website URL<input name="websiteUrl" required value="${esc(x?.websiteUrl)}" placeholder="https://example.com"></label><label>Category<select name="category">${CATS.map(c=>`<option${x?.category===c?" selected":""}>${c}</option>`).join("")}</select></label><label>GitHub URL (optional)<input name="githubUrl" value="${esc(x?.githubUrl)}"></label><label>Demo URL (optional)<input name="demoUrl" value="${esc(x?.demoUrl)}"></label><div class="acts"><button type="button" class="btn" data-a="mclose">Cancel</button><button class="btn pri" type="submit">${x?"Save changes":"Publish"}</button></div></form>`);
const profModal=()=>{const p=S.profile;modal(`<h2>Edit Profile</h2><form data-f="eprof"><label>Name<input name="name" required value="${esc(p.name)}"></label><label>Username<input name="username" required pattern="[A-Za-z0-9_.]{3,20}" value="${esc(p.username)}"></label><div class="g2"><label>Branch<input name="branch" required value="${esc(p.branch)}"></label><label>Year<select name="year">${YEARS.map(y=>`<option${p.year===y?" selected":""}>${y}</option>`).join("")}</select></label></div><label>Bio<textarea name="bio" maxlength="160">${esc(p.bio)}</textarea></label><p class="mut">College: ${esc(p.collegeName)} (cannot be changed)</p><div class="acts"><button type="button" class="btn" data-a="mclose">Cancel</button><button class="btn pri" type="submit">Save changes</button></div></form>`)};
const resetModal=()=>modal(`<h2>Reset your password</h2><form data-f="reset"><label>Email<input name="email" type="email" required></label><div class="acts"><button type="button" class="btn" data-a="mclose">Cancel</button><button class="btn pri" type="submit">Send Reset Link</button></div></form>`);

/* ---------- Data ---------- */
async function loadColleges(){if(demo){S.colleges=[DEMO_COLLEGE];return}try{const s=await F.getDocs(F.collection(db,"colleges"));S.colleges=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){console.error(e)}}
async function enter(){drawer(false);skeleton();
 if(demo){S.profile={name:"Demo Student",username:"demo",branch:"CSE",year:"3rd Year",collegeId:"demo",collegeName:DEMO_COLLEGE.name,collegeShortName:"PIEMR",bio:""};S.posts=DEMO_POSTS;return home()}
 try{const s=await F.getDocs(F.query(F.collection(db,"posts"),F.where("collegeId","==",S.profile.collegeId)));S.posts=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){console.error(e);S.posts=[];toast(fe(e),1)}
 home()}
async function route(u){
 if(!u){S.profile=null;S.posts=[];return landing()}
 const s=await F.getDoc(F.doc(db,"users",u.uid));
 if(s.exists()){S.profile=s.data();return enter()}
 S.profile=null;setupScreen()}

/* ---------- Actions ---------- */
const A={
 cs:()=>collegeRes(),
 pick(id){const c=S.colleges.find(x=>x.id===id);if(!c)return;S.college=c;S.creating=false;track("college_selected");demo?enter():auth.currentUser?setupScreen():authScreen("in")},
 newc(){if(isDemo())return;S.college=null;S.creating=true;auth.currentUser?setupScreen():authScreen("up")},
 home0(){S.college=null;S.creating=false;landing()},
 signup(){authScreen("up")},
 async google(_,b){if(isDemo())return;await run(b,"Signing in...",async()=>{try{await F.signInWithPopup(auth,new F.GoogleAuthProvider());track("login",{method:"google"})}catch(e){toast(e.code==="auth/popup-closed-by-user"?"Google sign-in was cancelled.":"Google sign-in couldn't be completed. Please try again.",1)}})},
 reset(){resetModal()},menu(){drawer(true)},menu0(){drawer(false)},mclose(_,__,e){if(e.target.classList.contains("ov")||e.target.dataset.a==="mclose")mclose()},
 flt(id){S.f=id;home()},clr(){S.f="";S.q="";home()},
 visit(){track("website_clicked")},
 new(){if(isDemo())return;drawer(false);postForm()},
 mine(){drawer(false);mine()},about(){drawer(false);about()},prof(){if(isDemo())return;drawer(false);profModal()},
 edit(id){postForm(S.posts.find(x=>x.id===id))},
 del(id){modal(`<h2>Delete this post?</h2><p class="mut">This action cannot be undone.</p><div class="acts" style="margin-top:16px"><button class="btn" data-a="mclose">Cancel</button><button class="btn bad" data-a="del2" data-id="${id}">Delete</button></div>`)},
 async del2(id,b){await run(b,"Deleting...",async()=>{await F.deleteDoc(F.doc(db,"posts",id));S.posts=S.posts.filter(x=>x.id!==id);mclose();S.view==="mine"?mine():home();toast("Post deleted.")})},
 async logout(){drawer(false);if(demo)return landing();await F.signOut(auth);S.college=null;S.creating=false;S.q="";S.f="";mclose()}
};
const H={
 async signin(f){const d=Object.fromEntries(new FormData(f));await run(f.querySelector("[type=submit]"),"Signing in...",async()=>{await F.signInWithEmailAndPassword(auth,d.email.trim(),d.password);track("login",{method:"email"})})},
 async reset(f){const d=Object.fromEntries(new FormData(f));await run(f.querySelector("[type=submit]"),"Sending...",async()=>{try{await F.sendPasswordResetEmail(auth,d.email.trim())}catch(e){if(e.code==="auth/invalid-email")throw e}mclose();toast("If an account exists for this email, a password reset link has been sent.")})},
 async profile(f){const d=Object.fromEntries(new FormData(f)),g=f.dataset.g==="1";d.username=d.username.trim().toLowerCase().replace(/^@/,"");
  await run(f.querySelector("[type=submit]"),g?"Saving...":"Creating account...",async()=>{
   if(!d.name.trim()||!d.branch.trim())throw{msg:"Please fill in all required fields."};
   if(!/^[a-z0-9_.]{3,20}$/.test(d.username))throw{msg:"Username must be 3–20 letters, numbers, _ or ."};
   if(!g&&d.password!==d.confirm)throw{msg:"Passwords don't match."};
   if((await F.getDoc(F.doc(db,"usernames",d.username))).exists())throw{msg:"That username is taken. Try another."};
   S.signing=true;
   try{
    const u=g?auth.currentUser:(await F.createUserWithEmailAndPassword(auth,d.email.trim(),d.password)).user;
    let c=S.college;
    if(S.creating){c={id:slug(d.cshort)+"-"+Math.random().toString(36).slice(2,7),name:d.cname.trim(),shortName:d.cshort.trim(),city:d.ccity.trim()};await F.setDoc(F.doc(db,"colleges",c.id),{name:c.name,shortName:c.shortName,city:c.city,createdBy:u.uid,createdAt:F.serverTimestamp()});S.colleges.push(c)}
    else if(!(await F.getDoc(F.doc(db,"colleges",c.id))).exists())throw{msg:"That college no longer exists."};
    const p={name:d.name.trim(),username:d.username,email:u.email,collegeId:c.id,collegeName:c.name,collegeShortName:c.shortName,branch:d.branch.trim(),year:d.year,bio:(d.bio||"").trim()};
    const b=F.writeBatch(db);b.set(F.doc(db,"usernames",d.username),{uid:u.uid});b.set(F.doc(db,"users",u.uid),{...p,createdAt:F.serverTimestamp(),updatedAt:F.serverTimestamp()});await b.commit();
    S.profile=p;track("sign_up",{method:g?"google":"email"});S.creating=false;await enter();
   }finally{S.signing=false}})},
 async post(f){const d=Object.fromEntries(new FormData(f)),id=f.dataset.id;
  await run(f.querySelector("[type=submit]"),id?"Saving...":"Publishing...",async()=>{
   if(!d.title.trim()||!d.description.trim())throw{msg:"Title and description are required."};
   const x={title:d.title.trim(),description:d.description.trim(),category:d.category,websiteUrl:normUrl(d.websiteUrl,true),githubUrl:normUrl(d.githubUrl),demoUrl:normUrl(d.demoUrl),updatedAt:F.serverTimestamp()};
   if(id){await F.updateDoc(F.doc(db,"posts",id),x);toast("Post updated successfully.")}
   else{const p=S.profile;await F.addDoc(F.collection(db,"posts"),{...x,userId:auth.currentUser.uid,collegeId:p.collegeId,authorName:p.name,authorUsername:p.username,authorBranch:p.branch,authorYear:p.year,createdAt:F.serverTimestamp()});track("post_created",{category:d.category});toast("Your website has been published.")}
   mclose();await enter();if(S.view==="mine")mine()})},
 async eprof(f){const d=Object.fromEntries(new FormData(f)),p=S.profile,u=auth.currentUser;d.username=d.username.trim().toLowerCase();
  await run(f.querySelector("[type=submit]"),"Saving...",async()=>{
   if(!/^[a-z0-9_.]{3,20}$/.test(d.username))throw{msg:"Username must be 3–20 letters, numbers, _ or ."};
   const b=F.writeBatch(db);
   if(d.username!==p.username){if((await F.getDoc(F.doc(db,"usernames",d.username))).exists())throw{msg:"That username is taken. Try another."};b.set(F.doc(db,"usernames",d.username),{uid:u.uid});b.delete(F.doc(db,"usernames",p.username))}
   const n={name:d.name.trim(),username:d.username,branch:d.branch.trim(),year:d.year,bio:d.bio.trim()};b.update(F.doc(db,"users",u.uid),{...n,updatedAt:F.serverTimestamp()});await b.commit();
   S.profile={...p,...n};mclose();toast("Profile updated.");S.view==="mine"?mine():home()})}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a;if(A[a]){if(t.tagName==="A"&&a==="visit"){A.visit();return}A[a](t.dataset.id,t,e)}});
document.addEventListener("submit",e=>{e.preventDefault();const h=H[e.target.dataset.f];if(h)h(e.target)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){mclose();drawer(false)}});

/* ---------- Boot ---------- */
await loadColleges();
if(demo)landing();
else F.onAuthStateChanged(auth,u=>{if(S.signing)return;route(u).catch(e=>{console.error(e);toast(fe(e),1);landing()})});
/* hide Spider-Man while scrolling */
let sc=false;addEventListener("scroll",()=>{const y=scrollY,room=document.documentElement.scrollHeight-innerHeight;if(!sc&&y>60&&room>400){sc=true;document.body.classList.add("scrolled")}else if(sc&&y<10){sc=false;document.body.classList.remove("scrolled")}},{passive:true});
</script></body></html>
