<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";

const app=initializeApp({apiKey:"AIzaSyCGt7is15VmSXzxWUmTY5ydUvCezOUiUNw",authDomain:"public-intelligence.firebaseapp.com",projectId:"public-intelligence",storageBucket:"public-intelligence.firebasestorage.app",messagingSenderId:"761508543647",appId:"1:761508543647:web:13c3eb848aebb3d45f76aa",measurementId:"G-76TL0KCGVT"});
const auth=getAuth(app),db=getFirestore(app);
const CATS=["Advice & Decisions","Learning & Explanations","Writing & Ideas","Tech & How-To","Opinions & Debates"];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const rand=()=>"PI-"+(1000+Math.floor(Math.random()*9000));
const ago=ts=>{if(!ts)return"just now";const s=Math.floor((Date.now()-ts.toDate().getTime())/1000);return s<60?"just now":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":Math.floor(s/86400)+"d ago"};
const score=a=>a.upvotes-a.downvotes;
let user=null,profile=null,cat="All",view="feed",qs=[],top={},cnt={},active=null,myVotes={},mode="signup",pendingNick="",answerT0=0;
const STOP=new Set(["a","an","the","is","are","was","were","am","be","been","being","i","you","he","she","it","we","they","my","your","his","her","its","our","their","this","that","these","those","of","to","in","on","at","by","for","with","about","as","into","like","through","after","over","between","out","against","during","without","before","under","around","among","and","or","but","if","so","do","does","did","not","no","yes","what","who","whom","which","how","why","when","where","can","could","will","would","should","shall","may","might","must","than","then","there","here","just","also","very","really","get","got","has","have","had"]);
const tokenize=s=>(String(s).toLowerCase().match(/[a-z0-9']+/g)||[]).filter(w=>w.length>1&&!STOP.has(w));
function looksGibberish(text){
 const clean=text.toLowerCase();
 const all=clean.replace(/[^a-z]/g,"");
 if(all.length<4)return false;
 let rep=1;for(let i=1;i<all.length;i++){if(all[i]===all[i-1]){rep++;if(rep>=4)return true}else rep=1}
 const rows=["qwertyuiop","asdfghjkl","zxcvbnm"];
 for(const row of rows){const rev=row.split("").reverse().join("");
  for(let i=0;i<=all.length-4;i++){const chunk=all.slice(i,i+4);if(row.includes(chunk)||rev.includes(chunk))return true}}
 const isV=c=>"aeiouy".includes(c);
 if(all.length>=10){const v=[...all].filter(isV).length;if(v/all.length<0.2)return true}
 for(const raw of clean.split(/\s+/)){
  const letters=raw.replace(/[^a-z]/g,"");if(letters.length<7)continue;
  const v=[...letters].filter(isV).length;let run=0,maxRun=0;
  for(const ch of letters){if(isV(ch))run=0;else{run++;if(run>maxRun)maxRun=run}}
  if(v/letters.length<0.25||maxRun>=5)return true}
 return false}
let sIndex={questions:[],top:{},loaded:false,loading:false},sTimer=null;

const open=id=>{$(id).classList.add("show");document.body.style.overflow="hidden"};

/* profile */
async function ensureProfile(u){const r=doc(db,"users",u.uid);let s=await getDoc(r);
 if(!s.exists()){await setDoc(r,{display_id:pendingNick||rand(),credit_balance:3,daily_votes_count:0,daily_answers_count:0,last_reset_date:today(),created_at:serverTimestamp()});s=await getDoc(r)}
 return s.data()}
const refreshProfile=async()=>{profile=(await getDoc(doc(db,"users",user.uid))).data();paint()};

 $("chip").style.display=user&&profile?"flex":"none";$("sinBtn").style.display=user?"none":"inline-block";
 if(!user||!profile){$("hr").textContent="Sign in to ask";return}
 const f=profile.last_reset_date===today();
 $("cr").textContent=profile.credit_balance;$("dv").textContent=f?profile.daily_votes_count:0;$("da").textContent=f?profile.daily_answers_count:0;
 $("idShort").textContent=(profile.display_id||"PI").split("-")[1]||"PI";$("idFull").textContent=profile.display_id;

 $("dabar").style.width=Math.min(100,(f?profile.daily_answers_count:0)/5*100)+"%";
 $("hr").textContent=profile.credit_balance>0?`You have ${profile.credit_balance}`:"Earn credit: vote/answer 5×"}

/* feed */
async function loadFeed(){

 const uref=doc(db,"users",user.uid),aref=doc(db,"answers",aid),vref=doc(db,"votes",user.uid+"_"+aid);
 try{await runTransaction(db,async t=>{const[u,a,v]=await Promise.all([t.get(uref),t.get(aref),t.get(vref)]);

  let up=a.data().upvotes,dn=a.data().downvotes;const prev=v.exists()?v.data().vote_type:null;

  t.update(aref,{upvotes:up,downvotes:dn});if(!v.exists())t.update(uref,bump(u.data(),"votes"))});

function blockPaste(el){
 // Permanently disable clipboard/drop insertion while keeping normal typing.
 const pasteMsg=()=>toast("Paste is disabled — type it yourself");

 // Desktop clipboard and drag/drop routes.
 el.addEventListener("paste",e=>{e.preventDefault();e.stopPropagation();pasteMsg()},true);
 el.addEventListener("drop",e=>{e.preventDefault();e.stopPropagation();pasteMsg()},true);
 el.addEventListener("dragover",e=>e.preventDefault(),true);
 el.addEventListener("contextmenu",e=>e.preventDefault(),true);

 // Desktop keyboard paste: Ctrl+V / Cmd+V.
 el.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==="v"||e.key==="V")){
   e.preventDefault();e.stopPropagation();pasteMsg();return;
  }
  if(el===$("ain")&&!answerT0&&e.key.length===1)answerT0=Date.now();
 },true);

 // Mobile browsers/keyboards: block every clipboard-style beforeinput route.
 el.addEventListener("beforeinput",e=>{
  const pasteTypes=[
   "insertFromPaste",
   "insertFromPasteAsQuotation",
   "insertFromDrop",
   "insertReplacementText"
  ];
  if(pasteTypes.includes(e.inputType)){
   e.preventDefault();e.stopPropagation();pasteMsg();return;
  }

  // Some mobile keyboards expose clipboard insertion as insertText with
  // multiple characters. Normal character typing is one character at a time.
  if(e.inputType==="insertText"&&e.data&&e.data.length>1){
   e.preventDefault();e.stopPropagation();pasteMsg();return;
  }
 },true);

 // Final protection for mobile devices where beforeinput cannot be cancelled.
 // This also catches clipboard insertion that reaches the control anyway.
 let previousValue=el.value;
 let previousSelectionStart=el.selectionStart;
 let previousSelectionEnd=el.selectionEnd;

 el.addEventListener("input",e=>{
  const v=el.value;
  const inputType=e.inputType||"";

  if(
   inputType.includes("Paste") ||
   inputType==="insertFromDrop" ||
   inputType==="insertReplacementText" ||
   (inputType==="insertText"&&v.length-previousValue.length>1)
  ){
   el.value=previousValue;
   try{el.setSelectionRange(previousSelectionStart,previousSelectionEnd)}catch(_){}
   pasteMsg();
   return;
  }

  previousValue=v;
  previousSelectionStart=el.selectionStart;
  previousSelectionEnd=el.selectionEnd;
 },true);

 // Refresh the snapshot whenever the field receives focus.
 el.addEventListener("focus",()=>{
  previousValue=el.value;
  previousSelectionStart=el.selectionStart;
  previousSelectionEnd=el.selectionEnd;
 },true);
}

async function seedStarterContent(){
 try{
  const first=await getDoc(doc(db,"questions","starter_q1"));
  if(first.exists())return;

  const now=serverTimestamp();
  for(const q of STARTER_DATA){
   await setDoc(doc(db,"questions",q.id),{
    user_id:"starter_system",
    text:q.text,
    category:q.category,
    created_at:now
   });
   for(const a of q.answers){
    await setDoc(doc(db,"answers",a[0]),{
     question_id:q.id,
     user_id:"starter_system",
     text:a[1],
     upvotes:a[2],
     downvotes:a[3],
     report_count:0,
     flagged:false,
     created_at:now
    });
   }
  }
 }catch(e){
  console.warn("Starter content was not seeded:",e.message);
 }
}

 if(u)try{profile=await ensureProfile(u)}catch(e){toast("Profile error: "+e.message)}

tabs();setMode("signup");seedStarterContent();
